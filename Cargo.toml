[package]
name = "stormglass"
version = "0.1.0"
edition = "2021"
description = "Claude Code session JSONL analyzer — per-turn token telemetry, thinking-block analysis, context burn curves"
license = "MIT"

[[bin]]
name = "stormglass"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
# UTC arithmetic only; default-features=false drops the TZ db, RUSTSEC-2020-0071 n/a
